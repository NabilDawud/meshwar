<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f766e"/>
      <stop offset="50%" stop-color="#0d9488"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <!-- Glass Reflection -->
    <linearGradient id="glassGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.7"/>
    </linearGradient>

    <!-- Headlight Glow -->
    <radialGradient id="amberGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="60%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </radialGradient>

    <!-- Drop Shadow for Van -->
    <filter id="vanShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#042f2e" flood-opacity="0.45"/>
    </filter>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Squircle Base App Icon -->
  <rect width="512" height="512" rx="120" fill="url(#bgGrad)"/>

  <!-- Subtle Inner Border Highlight -->
  <rect x="8" y="8" width="496" height="496" rx="112" fill="none" stroke="#ffffff" stroke-opacity="0.18" stroke-width="6"/>

  <!-- Subtle Background Geometric Pulse Lines (representing Gaza transit arteries) -->
  <path d="M 0 380 Q 256 340 512 380" fill="none" stroke="#2dd4bf" stroke-width="8" stroke-opacity="0.25"/>
  <path d="M 0 420 Q 256 390 512 420" fill="none" stroke="#2dd4bf" stroke-width="12" stroke-opacity="0.2"/>

  <!-- Ground Shadow -->
  <ellipse cx="256" cy="405" rx="160" ry="24" fill="#042f2e" opacity="0.4"/>

  <!-- Main Van Body Group with Shadow -->
  <g filter="url(#vanShadow)">
    <!-- Van Cabin (Main Shell) -->
    <rect x="136" y="140" width="240" height="230" rx="48" fill="#ffffff"/>

    <!-- Roof Trim Highlight -->
    <path d="M 180 140 L 332 140 Q 376 140 376 184 L 376 160 Q 376 140 332 140 Z" fill="#f1f5f9"/>

    <!-- Front Windshield -->
    <rect x="160" y="166" width="192" height="96" rx="28" fill="url(#glassGrad)"/>
    
    <!-- Windshield Reflection Glare -->
    <path d="M 172 176 L 250 176 L 210 250 L 172 250 Z" fill="#ffffff" opacity="0.35"/>

    <!-- Front Grill / Middle Bar -->
    <rect x="180" y="280" width="152" height="34" rx="12" fill="#0f766e"/>
    
    <!-- Grill Vents -->
    <line x1="205" y1="297" x2="235" y2="297" stroke="#2dd4bf" stroke-width="4" stroke-linecap="round"/>
    <line x1="245" y1="297" x2="267" y2="297" stroke="#2dd4bf" stroke-width="4" stroke-linecap="round"/>
    <line x1="277" y1="297" x2="307" y2="297" stroke="#2dd4bf" stroke-width="4" stroke-linecap="round"/>

    <!-- Left Headlight (Glowing Modern Amber LED) -->
    <rect x="150" y="284" width="22" height="26" rx="8" fill="url(#amberGlow)" filter="url(#softGlow)"/>

    <!-- Right Headlight (Glowing Modern Amber LED) -->
    <rect x="340" y="284" width="22" height="26" rx="8" fill="url(#amberGlow)" filter="url(#softGlow)"/>

    <!-- Front Bumper -->
    <rect x="146" y="330" width="220" height="32" rx="16" fill="#e2e8f0"/>
    <rect x="216" y="336" width="80" height="20" rx="6" fill="#0d9488"/>
    <text x="256" y="351" font-family="'Cairo', sans-serif" font-weight="900" font-size="12" fill="#ffffff" text-anchor="middle">غزة</text>

    <!-- Left Wheel -->
    <rect x="144" y="360" width="34" height="24" rx="8" fill="#1e293b"/>

    <!-- Right Wheel -->
    <rect x="334" y="360" width="34" height="24" rx="8" fill="#1e293b"/>
  </g>

  <!-- Modern Dynamic Sparkle / Star (Top Right of Icon) -->
  <path d="M 390 100 Q 405 115 420 115 Q 405 115 390 130 Q 375 115 360 115 Q 375 115 390 100 Z" fill="#fef08a" opacity="0.95"/>
  <circle cx="390" cy="115" r="4" fill="#ffffff"/>
</svg>