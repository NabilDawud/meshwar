<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="sky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#bae6fd"/>
    </linearGradient>
    <linearGradient id="ground" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
    <linearGradient id="carBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
  </defs>
  
  <!-- Sky & Road -->
  <rect width="800" height="400" fill="url(#sky)"/>
  <rect y="400" width="800" height="200" fill="url(#ground)"/>
  <line x1="0" y1="520" x2="800" y2="520" stroke="#94a3b8" stroke-width="4" stroke-dasharray="25,20"/>

  <!-- Private Car Body -->
  <g id="private-car">
    <rect x="200" y="310" width="400" height="110" rx="22" fill="url(#carBody)"/>
    <path d="M 260 310 L 330 220 L 480 220 L 550 310 Z" fill="#1e40af"/>
    <!-- Windows -->
    <path d="M 275 305 L 335 230 L 395 230 L 395 305 Z" fill="#e0f2fe" opacity="0.9"/>
    <path d="M 405 230 L 470 230 L 535 305 L 405 305 Z" fill="#e0f2fe" opacity="0.9"/>
    <!-- Headlights & Taillights -->
    <rect x="580" y="335" width="18" height="22" rx="4" fill="#fef08a"/>
    <rect x="202" y="335" width="12" height="20" rx="4" fill="#ef4444"/>
    <!-- Wheels -->
    <circle cx="280" cy="420" r="38" fill="#1e293b"/>
    <circle cx="280" cy="420" r="18" fill="#94a3b8"/>
    <circle cx="520" cy="420" r="38" fill="#1e293b"/>
    <circle cx="520" cy="420" r="18" fill="#94a3b8"/>
  </g>

  <!-- Text / Badge -->
  <rect x="330" y="490" width="140" height="32" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
  <text x="400" y="512" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#1e293b">غزة - 4567</text>
</svg>
