<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="sky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#bae6fd"/>
    </linearGradient>
    <linearGradient id="ground" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
    <linearGradient id="body" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f766e"/>
      <stop offset="100%" stop-color="#14b8a6"/>
    </linearGradient>
    <linearGradient id="cart" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
  </defs>
  
  <!-- Sky & Road -->
  <rect width="800" height="400" fill="url(#sky)"/>
  <rect y="400" width="800" height="200" fill="url(#ground)"/>
  <line x1="0" y1="520" x2="800" y2="520" stroke="#94a3b8" stroke-width="4" stroke-dasharray="25,20"/>

  <!-- Towing Car (Front) -->
  <g id="towing-vehicle">
    <rect x="440" y="310" width="220" height="110" rx="20" fill="url(#body)"/>
    <path d="M 470 310 L 520 240 L 610 240 L 640 310 Z" fill="#0d9488"/>
    <!-- Windows -->
    <path d="M 480 305 L 525 248 L 565 248 L 565 305 Z" fill="#e0f2fe" opacity="0.85"/>
    <path d="M 575 248 L 605 248 L 630 305 L 575 305 Z" fill="#e0f2fe" opacity="0.85"/>
    <!-- Headlights -->
    <circle cx="650" cy="340" r="12" fill="#fef08a"/>
    <!-- Wheels -->
    <circle cx="490" cy="420" r="32" fill="#1e293b"/>
    <circle cx="490" cy="420" r="16" fill="#94a3b8"/>
    <circle cx="610" cy="420" r="32" fill="#1e293b"/>
    <circle cx="610" cy="420" r="16" fill="#94a3b8"/>
  </g>

  <!-- Hitch / Tow Bar -->
  <rect x="360" y="370" width="90" height="14" rx="4" fill="#475569"/>

  <!-- Passenger Cart (Ajala - عجلة) -->
  <g id="ajala-cart">
    <!-- Canopy Roof -->
    <rect x="120" y="210" width="250" height="16" rx="8" fill="#1e293b"/>
    <line x1="140" y1="226" x2="140" y2="320" stroke="#64748b" stroke-width="6"/>
    <line x1="245" y1="226" x2="245" y2="320" stroke="#64748b" stroke-width="6"/>
    <line x1="350" y1="226" x2="350" y2="320" stroke="#64748b" stroke-width="6"/>
    <!-- Cart Body -->
    <rect x="110" y="320" width="260" height="95" rx="12" fill="url(#cart)"/>
    <!-- Seat outlines (10 passenger capacity representation) -->
    <rect x="130" y="280" width="30" height="40" rx="6" fill="#78350f" opacity="0.7"/>
    <rect x="180" y="280" width="30" height="40" rx="6" fill="#78350f" opacity="0.7"/>
    <rect x="230" y="280" width="30" height="40" rx="6" fill="#78350f" opacity="0.7"/>
    <rect x="280" y="280" width="30" height="40" rx="6" fill="#78350f" opacity="0.7"/>
    <rect x="330" y="280" width="30" height="40" rx="6" fill="#78350f" opacity="0.7"/>
    <!-- Cart Wheels -->
    <circle cx="170" cy="420" r="34" fill="#1e293b"/>
    <circle cx="170" cy="420" r="18" fill="#cbd5e1"/>
    <circle cx="310" cy="420" r="34" fill="#1e293b"/>
    <circle cx="310" cy="420" r="18" fill="#cbd5e1"/>
    <!-- Cart Badge Text -->
    <text x="240" y="375" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#ffffff" text-anchor="middle">عجلة 10 ركاب</text>
  </g>
  
  <!-- Banner Label -->
  <rect x="20" y="20" width="220" height="45" rx="12" fill="#0f172a" opacity="0.85"/>
  <text x="130" y="50" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#ffffff" text-anchor="middle">مشوار غزة - مركبة نموذجية</text>
</svg>
