name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gate:
    name: Code Quality & Automated Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo, sqlite3, pdo_sqlite, pdo_mysql, bcmath, intl, zip, opcache
          coverage: none
          tools: composer:v2

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Cache Composer Dependencies
        uses: actions/cache@v4
        with:
          path: vendor
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Install Composer Dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Check Code Style (Laravel Pint)
        run: vendor/bin/pint --test

      - name: Install Node Dependencies
        run: npm ci

      - name: Compile Frontend Assets
        run: npm run build

      - name: Setup Environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Run Test Suite (PHPUnit)
        run: php artisan test --compact
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: ':memory:'

      - name: Verify Production Caching
        run: |
          php artisan config:cache
          php artisan route:cache
          php artisan view:cache
          php artisan config:clear
          php artisan route:clear
          php artisan view:clear

  deploy-dokku:
    name: Continuous Deployment to Dokku
    needs: quality-gate
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check Dokku Deployment Credentials
        id: check-secrets
        run: |
          if [ -n "${{ secrets.DOKKU_SSH_PRIVATE_KEY }}" ]; then
            echo "configured=true" >> $GITHUB_OUTPUT
            echo "Deploy credentials detected."
          else
            echo "configured=false" >> $GITHUB_OUTPUT
            echo "::notice title=Dokku Deployment Credentials Missing::Set DOKKU_SSH_PRIVATE_KEY in GitHub Secrets to enable automatic deployments. See docs/DEPLOYMENT.md."
          fi

      - name: Deploy to Dokku Server
        if: steps.check-secrets.outputs.configured == 'true'
        uses: dokku/github-action@v1.6.0
        with:
          git_remote_url: 'ssh://dokku@${{ secrets.DOKKU_HOST || "apps.taqat.academy" }}:22/meshwar'
          ssh_private_key: ${{ secrets.DOKKU_SSH_PRIVATE_KEY }}
          git_branch: 'main'
